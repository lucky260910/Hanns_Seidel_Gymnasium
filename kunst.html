<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kunstanalyse: Der Wanderer über dem Nebelmeer</title>
    <!-- Google Fonts for romantic headers and clean readability -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-gold: #c5a880;
            --bg-light: #f4f6f8;
            --text-dark: #2c3e50;
            --text-muted: #5a6b7c;
            --card-bg: rgba(255, 255, 255, 0.92);
            --border-radius: 12px;
            --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.05);
            --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            background-image: linear-gradient(rgba(244, 246, 248, 0.9), rgba(244, 246, 248, 0.95)), url('input_file_2.png');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            color: var(--text-dark);
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 4rem 1rem 2rem;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

        header p {
            font-size: 1.1rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem 4rem;
        }

        /* Hero Layout: Image + Core Metadata */
        .hero-section {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 2.5rem;
            margin-bottom: 4rem;
            align-items: start;
        }

        @media (max-width: 900px) {
            .hero-section {
                grid-template-columns: 1fr;
            }
        }

        .artwork-container {
            position: relative;
            background-color: #fff;
            padding: 1rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-card);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .artwork-container:hover {
            transform: translateY(-5px);
        }

        .artwork-image {
            width: 100%;
            height: auto;
            border-radius: calc(var(--border-radius) - 4px);
            display: block;
        }

        .metadata-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-card);
            border-left: 5px solid var(--accent-gold);
        }

        .metadata-card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        .metadata-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
        }

        .metadata-table tr {
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .metadata-table tr:last-child {
            border-bottom: none;
        }

        .metadata-table td {
            padding: 0.8rem 0;
            font-size: 0.95rem;
        }

        .metadata-label {
            font-weight: 600;
            color: var(--text-muted);
            width: 35%;
        }

        .metadata-value {
            color: var(--text-dark);
        }

        .first-impression {
            background-color: rgba(197, 168, 128, 0.15);
            padding: 1.5rem;
            border-radius: var(--border-radius);
            border-left: 3px solid var(--accent-gold);
            font-style: italic;
        }

        .first-impression strong {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            display: block;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
            font-style: normal;
        }

        /* Feature Sections Grid */
        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .analysis-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-subtle);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        .analysis-card:hover {
            box-shadow: var(--shadow-card);
            transform: translateY(-2px);
        }

        .analysis-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin-bottom: 1.2rem;
            color: var(--primary-color);
            border-bottom: 2px solid var(--accent-gold);
            padding-bottom: 0.5rem;
            display: inline-block;
        }

        .analysis-list {
            list-style: none;
        }

        .analysis-list li {
            margin-bottom: 0.8rem;
            padding-left: 1.5rem;
            position: relative;
        }

        .analysis-list li::before {
            content: "•";
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 1.2rem;
            position: absolute;
            left: 0;
            top: -2px;
        }

        .sub-list {
            margin-left: 1rem;
            margin-top: 0.4rem;
            list-style: none;
        }

        .sub-list li::before {
            content: "└";
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-right: 0.5rem;
